pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: gofmt -s -w ./

    lint:
      tags: backend style
      glob: "*.go"
      run: golangci-lint run

    mod-tidy:
      run: go mod tidy -diff

pre-push:
  commands:
    tests:
      run: go test -timeout 2s ./... -short
