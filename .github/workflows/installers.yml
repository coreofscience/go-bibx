name: Installers

on:
  push:
    branches: ["main"]
    paths: ["installers/**", ".github/workflows/installers.yml"]
  pull_request:
    branches: ["main"]
    paths: ["installers/**", ".github/workflows/installers.yml"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck installers/install.sh

  install-sh:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run install.sh
        run: sh installers/install.sh
      - name: Run bibx
        run: ~/.local/bin/bibx --version

  install-ps1:
    strategy:
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Run install.ps1
        run: ./installers/install.ps1
      - name: Run bibx
        run: '& "$env:LOCALAPPDATA\Programs\bibx\bibx.exe" --version'
