<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bibx Collection Viewer</title>
    </head>
    <body>
        <div id="container"></div>
    </body>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #container {
            width: 100dvw;
            height: 100dvh;
        }

        svg {
            display: block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module">
        function color(node) {
            switch (node.category) {
                case "none":
                    return "lightgray";
                case "root":
                    return "yellow";
                case "trunk":
                    return "brown";
                case "leaf":
                    return "green";
                default:
                    return "#ddd";
            }
        }

        d3.json("/collection.json.gz").then((data) => {
            const getMinPositive = (data, key) => {
                const values = data.map((d) => d[key]).filter((v) => v > 0);
                return values.length > 0 ? d3.min(values) : 1; // Fallback to 1 if all are 0
            };

            const bounds = {
                root: {
                    min: getMinPositive(data.nodes, "rootness"),
                    max: d3.max(data.nodes, (d) => d.rootness),
                },
                trunk: {
                    min: getMinPositive(data.nodes, "trunkness"),
                    max: d3.max(data.nodes, (d) => d.trunkness),
                },
                leaf: {
                    min: getMinPositive(data.nodes, "leafness"),
                    max: d3.max(data.nodes, (d) => d.leafness),
                },
            };

            const normalizeLog = (val, min, max) => {
                if (val <= 0) return 0;
                // Map the value from [min, max] to [0.1, 1] logarithmically
                // We start at 0.1 so that the smallest positive value still has some "weight"
                const scale = d3
                    .scaleSymlog()
                    .domain([min, max])
                    .range([0.01, 1]);
                return scale(val);
            };

            const areaScale = d3
                .scaleSymlog()
                .domain([0, 1])
                .range([Math.PI * 5 ** 2, Math.PI * 30 ** 2])
                .constant(0.1); // Small constant for sensitivity at low values

            // 3. The "Fair" Radius Function
            const getFairRadius = (d) => {
                const nRoot = normalizeLog(
                    d.rootness,
                    bounds.root.min,
                    bounds.root.max,
                );
                const nTrunk = normalizeLog(
                    d.trunkness,
                    bounds.trunk.min,
                    bounds.trunk.max,
                );
                const nLeaf = normalizeLog(
                    d.leafness,
                    bounds.leaf.min,
                    bounds.leaf.max,
                );

                // Pick the winner
                const winner = Math.max(nRoot, nTrunk, nLeaf);

                // Calculate radius from area
                return Math.sqrt(areaScale(winner) / Math.PI);
            };

            data.nodes.forEach((d) => {
                d.radius = getFairRadius(d);
            });

            const container = document.getElementById("container");
            let width = container.clientWidth;
            let height = container.clientHeight;

            const svg = d3
                .select(container)
                .append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            const simulation = d3
                .forceSimulation(data.nodes)
                .force(
                    "link",
                    d3
                        .forceLink(data.links)
                        .id((d) => d.id)
                        .distance(100)
                        .strength(0.01),
                )
                .force(
                    "charge",
                    d3
                        .forceManyBody()
                        .strength((d) => {
                            if (d.category === "leaf") return -100; // Stronger repulsion for leaves
                            if (d.category === "trunk") return -20; // Medium repulsion
                            return -20; // Roots stay close together
                        })
                        .distanceMax(width / 4),
                )
                .force(
                    "y",
                    d3
                        .forceY()
                        .y((d) => {
                            // We use the same categories you defined for your metrics
                            if (d.category === "root") return height * 0.85;
                            if (d.category === "trunk") return height * 0.5;
                            if (d.category === "leaf") return height * 0.25;
                            return height / 2;
                        })
                        .strength((d) => {
                            if (d.category === "none") return 0.1;
                            if (d.category === "leaf") return 0.3;
                            return 0.15;
                        }), // Strength of the "lane" gravity
                )
                .force("x", d3.forceX(width / 2).strength(0.1))
                .force(
                    "collide",
                    d3.forceCollide().radius((d) => d.radius + 1),
                )
                .force("boundary", () => {
                    const padding = 30;
                    for (let node of data.nodes) {
                        const r = 5 + padding;
                        // If node goes past the left edge, give it a positive velocity boost
                        if (node.x < r) node.vx += (r - node.x) * 0.1;
                        // If node goes past the right edge, give it a negative boost
                        if (node.x > width - r)
                            node.vx -= (node.x - (width - r)) * 0.1;

                        // Repeat for Y...
                        if (node.y < r) node.vy += (r - node.y) * 0.1;
                        if (node.y > height - r)
                            node.vy -= (node.y - (height - r)) * 0.1;
                    }
                });

            const node = svg
                .append("g")
                .selectAll("circle")
                .data(data.nodes)
                .join("circle")
                .attr("r", (d) => d.radius)
                .attr("fill", (node) => color(node));

            simulation.on("tick", () => {
                node.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
            });

            const drag = (simulation) => {
                function dragStarted(event) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    event.subject.fx = event.x;
                    event.subject.fy = event.y;
                }
                function dragged(event) {
                    event.subject.fx = event.x;
                    event.subject.fy = event.y;
                }
                function dragEnded(event) {
                    if (!event.active) simulation.alphaTarget(0);
                    event.subject.fx = null;
                    event.subject.fy = null;
                }
                return d3
                    .drag()
                    .on("start", dragStarted)
                    .on("drag", dragged)
                    .on("end", dragEnded);
            };

            node.call(drag(simulation));

            let resizeTimeout;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    const container = document.getElementById("container");
                    width = container.clientWidth;
                    height = container.clientHeight;
                    svg.attr("viewBox", `0 0 ${width} ${height}`);
                    simulation.force(
                        "center",
                        d3.forceCenter(width / 2, height / 2),
                    );
                    simulation.alpha(0.3).restart();
                }, 500);
            });
        });
    </script>
    <script>
        const evtSource = new EventSource("/events");
        evtSource.onerror = () => {
            // The connection broke because the server shut down.
            // Wait a moment for the build to finish, then poll for restart.
            setTimeout(() => {
                location.reload();
            }, 500);
        };
    </script>
</html>
